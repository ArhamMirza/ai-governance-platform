# One address for the app and the API. TLS is not terminated here: put your own
# https proxy in front of this port for anything other than trying it out (see
# deploy/README.md; it adds Strict-Transport-Security).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # The API. It sets its own protective headers, so none are added here. The
    # real client address is handed on so the sign-in limits count each person
    # separately, and the Host header keeps its port: the API's cross-site check
    # compares a browser's Origin with it.
    # Docker's own resolver, asked again every few seconds: if the backend container
    # is replaced it may come back at a different address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;   # the app accepts uploads up to 25 MB
    }

    # Built files are named by their content, so they can be kept for good.
    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The app. Any other address is the single-page app's own route.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The jobs only read the repository, so the token they run with can only read it.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Dependency vulnerabilities (pip-audit)
        # Reads the resolved environment rather than requirements files, so
        # transitive dependencies (litellm's own deps, etc.) are covered too.
        # Not --strict: that also fails the build on a package pip-audit
        # simply couldn't audit (e.g. this project's own editable install),
        # which isn't a vulnerability finding.
        run: pipx run pip-audit --skip-editable

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 20 reached end of life in April 2026, and vitest and jest-dom
          # already require 22 or newer.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Built page works under a strict Content-Security-Policy
        run: node scripts/csp-check.mjs dist/index.html

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 20 reached end of life in April 2026, and vitest and jest-dom
          # already require 22 or newer.
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build


name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Dependency vulnerabilities (pip-audit)
        # Reads the resolved environment rather than requirements files, so
        # transitive dependencies (litellm's own deps, etc.) are covered too.
        # Not --strict: that also fails the build on a package pip-audit
        # simply couldn't audit (e.g. this project's own editable install),
        # which isn't a vulnerability finding.
        run: pipx run pip-audit --skip-editable

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

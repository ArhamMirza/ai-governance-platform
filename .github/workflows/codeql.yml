name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Dependency-aware queries change as new advisories are published, not
    # only when this repo's own code changes -- a weekly run catches a
    # newly-disclosed issue in code that hasn't been touched in months.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # The analyze step calls the workflow-runs API to correlate its results
      # with this run; without read access to Actions, that call is refused
      # and the whole job reports "configuration error" even though the scan
      # itself completed.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
